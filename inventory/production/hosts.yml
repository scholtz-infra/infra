# Cluster inventory. The inventory name of a host becomes its hostname and its Kubernetes node name.
# Adding a server = add its name here in a PR, add its address to the NODE_IPS secret, then run
# the "site" playbook (see AGENTS.md). Server addresses are not written in this repository.
#
# control_plane: nodes that run the API server + etcd AND normal workloads. Must be 1, 3 or 5 hosts.
# workers:       nodes that only run workloads.
all:
  children:
    k8s_cluster:
      children:
        control_plane:
          hosts:
            s-01-de: {}
        workers:
          hosts: {}
