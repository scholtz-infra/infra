# Cluster inventory. The inventory name of a host becomes its hostname and its Kubernetes node name.
# Adding a server = add it here in a PR, then run the "site" playbook (see AGENTS.md).
#
# control_plane: nodes that run the API server + etcd AND normal workloads. Must be 1, 3 or 5 hosts.
# workers:       nodes that only run workloads.
all:
  children:
    k8s_cluster:
      children:
        control_plane:
          hosts:
            node1:
              ansible_host: 203.0.113.10 # PLACEHOLDER - replace with the public IPv4 of the first server
        workers:
          hosts: {}
