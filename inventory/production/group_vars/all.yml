# Cluster-wide settings. Versions are pinned here and bumped by PR (Renovate or by hand).
# How Ansible logs in to the servers (user, sudo, address) is in group_vars/k8s_cluster.yml.
#
# The SSH port is not written in this repository: it comes from the SSH_PORT repository secret.
# The owner sets it on a new server with scripts/bootstrap-server.sh; a server that
# still listens on 22 is detected by the site playbook and moved (roles/ssh).
ssh_port: "{{ lookup('ansible.builtin.env', 'SSH_PORT') | default('22', true) | int }}"
# Server addresses are not written in this repository either: the NODE_IPS secret holds one
# "<inventory name> <public IPv4>" pair per line.
node_ips: "{{ dict(lookup('ansible.builtin.env', 'NODE_IPS').split() | batch(2)) }}"

cluster_name: prod
node_ip: "{{ ansible_host }}"

# renovate: datasource=github-releases depName=kubernetes/kubernetes extractVersion=^v(?<version>.+)$
kubernetes_version: "1.37.2"
kubernetes_minor: "{{ kubernetes_version.split('.')[:2] | join('.') }}"

# The API server is reached by every node through a HAProxy listening on localhost that balances
# over all control-plane nodes. This is what makes the control plane HA without a floating IP.
kube_api_internal_host: api.k8s.internal
kube_api_lb_port: 7443
# Port the API servers listen on, on every control-plane node (instead of the default 6443).
# From outside it is reached on the same port through the load balancer. Like the SSH port it is
# not written in this repository: it comes from the K8S_API_PORT repository secret. When the
# secret changes, the next site run moves the API servers (roles/kubernetes).
kube_api_port: "{{ lookup('ansible.builtin.env', 'K8S_API_PORT') | int }}"
# Public name of the API for kubectl and application deployments from GitHub Actions:
# https://k8s.biatec.io:<K8S_API_PORT>. It resolves to the Hetzner load balancer, which forwards
# the port to all control-plane nodes. Part of the API server certificate: fixed once the
# cluster exists.
kube_api_external_fqdn: k8s.biatec.io

# Public name of the Headlamp dashboard (docs/dashboard.md). Must resolve to the load balancer.
dashboard_fqdn: dashboard.k8s.biatec.io

pod_cidr: 10.244.0.0/16
service_cidr: 10.96.0.0/12

# All traffic from the internet except SSH enters through a Hetzner Cloud Load Balancer (managed
# by the owner in the Hetzner console, see docs/setup.md):
#   - web: TCP 443 -> ingress_https_port on every node, with PROXY protocol so applications see
#     the real client address. Port 80 is not served.
#   - Kubernetes API: TCP kube_api_port -> kube_api_port on the control-plane nodes, no PROXY
#     protocol.
ingress_lb_ipv4: 167.235.110.199
ingress_lb_ipv6: "2a01:4f8:1c1f:690b::1"
ingress_https_port: 53443
# Cilium always opens a plain HTTP listener as well; it is never reachable from outside the nodes.
ingress_http_port: 53080
ingress_proxy_protocol: true
# The load balancer's web service may also deliver to these ports on the nodes (its destination
# port is 443 at the moment): connections from the load balancer to them are redirected to
# ingress_https_port by the host firewall. Nothing listens on them and nobody else reaches them.
ingress_lb_redirect_ports:
  - 443

# Host firewall. From the internet only the SSH port is reachable; the API and ingress ports only
# from the load balancer. Everything else is only open between cluster nodes.
firewall_public_tcp_ports:
  - "{{ ssh_port }}"
firewall_lb_sources:
  - "{{ ingress_lb_ipv4 }}"
firewall_lb_tcp_ports:
  - "{{ kube_api_port }}"
  - "{{ ingress_https_port }}"
# Listening ports inside the kernel's range for outgoing connections: keep them reserved.
reserved_ports:
  - "{{ ssh_port }}"
  - "{{ kube_api_port }}"
  - "{{ ingress_https_port }}"
  - "{{ ingress_http_port }}"

# App repositories authenticate to the API server with their GitHub Actions OIDC token.
# Only repositories owned by these GitHub users/orgs are accepted at all; what a repository may do
# is defined in platform/tenants.yml.
github_oidc_audience: "k8s-{{ cluster_name }}"
github_oidc_allowed_owners:
  - scholtz-infra

# The node kubectl/helm commands are executed on (playbooks use the same default for their
# `hosts:`). To use another node, pass it as extra var: -e kubectl_host=nodeX.
kubectl_host: "{{ groups['control_plane'] | first }}"

# Control-plane nodes that are already part of the cluster (fact set by the kubernetes role).
k8s_joined_cps: >-
  {{ groups['control_plane'] | map('extract', hostvars) | selectattr('k8s_joined', 'defined')
     | selectattr('k8s_joined') | map(attribute='inventory_hostname') | list }}
# Node used to hand out join credentials: an existing member, or the first control plane on day one.
k8s_seed: "{{ (k8s_joined_cps + groups['control_plane']) | first }}"
k8s_multi_node: "{{ groups['k8s_cluster'] | length > 1 }}"

os_patch_reboot: true
