- name: Configure the Kubernetes package repository
  ansible.builtin.import_tasks: repo.yml

- name: Check whether Kubernetes packages are installed
  ansible.builtin.stat:
    path: /usr/bin/kubeadm
  register: kubernetes_kubeadm_bin

# Only on first install. Version changes on existing nodes go through playbooks/k8s-upgrade.yml.
- name: Install kubelet, kubeadm and kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_version }}-*"
      - "kubeadm={{ kubernetes_version }}-*"
      - "kubectl={{ kubernetes_version }}-*"
    state: present
  when: not kubernetes_kubeadm_bin.stat.exists

# crictl is no longer pulled in by kubeadm. The etcdctl wrapper, the etcd snapshots and the
# maintenance playbook need it. It is not held: it only moves within the repository's minor.
- name: Install crictl
  ansible.builtin.apt:
    name: cri-tools
    state: present

- name: Hold Kubernetes packages so OS patching never upgrades them
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true

- name: Control-plane configuration
  when: inventory_hostname in groups['control_plane']
  block:
    - name: Create the API server authentication config directory
      ansible.builtin.file:
        path: /etc/kubernetes/auth
        state: directory
        mode: "0755"

    - name: Configure API server authentication (GitHub Actions OIDC)
      ansible.builtin.template:
        src: authentication-config.yaml.j2
        dest: /etc/kubernetes/auth/authentication-config.yaml
        mode: "0644"

    - name: Write the kubeadm configuration
      ansible.builtin.template:
        src: kubeadm-config.yaml.j2
        dest: /etc/kubernetes/kubeadm-config.yaml
        mode: "0600"

- name: Check whether this node is already part of a cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubernetes_kubelet_conf

- name: Record cluster membership
  ansible.builtin.set_fact:
    k8s_joined: "{{ kubernetes_kubelet_conf.stat.exists }}"

# The API port comes from the K8S_API_PORT secret. When it differs from the port a running API
# server listens on, the static pod manifest is regenerated from the kubeadm configuration and
# kubelet restarts the API server on the new port (a short API outage; on several control-plane
# nodes all of them move in the same run). The firewall and HAProxy roles have already switched.
# kubelet, controller manager and scheduler of a control-plane node talk to the API server of
# their own node directly (not through HAProxy): their kubeconfigs carry the port as well.
- name: Move the API server to the configured port
  when:
    - k8s_joined
    - inventory_hostname in groups['control_plane']
  block:
    - name: Check the port the API server listens on
      ansible.builtin.command: >-
        grep -c -- '--secure-port={{ kube_api_port }}$' /etc/kubernetes/manifests/kube-apiserver.yaml
      register: kubernetes_port_check
      changed_when: false
      failed_when: kubernetes_port_check.rc > 1
      no_log: true

    - name: Regenerate the API server manifest
      ansible.builtin.command: >-
        kubeadm init phase control-plane apiserver --config /etc/kubernetes/kubeadm-config.yaml
      when: kubernetes_port_check.rc == 1
      changed_when: true

    - name: Point the node-local kubeconfigs at the configured port
      ansible.builtin.replace:
        path: "/etc/kubernetes/{{ item }}"
        regexp: '^(\s*server: https://{{ node_ip | regex_escape }}):\d+$'
        replace: '\1:{{ kube_api_port }}'
      loop:
        - kubelet.conf
        - controller-manager.conf
        - scheduler.conf
      register: kubernetes_kubeconfigs
      no_log: true

    - name: Decide whether the control plane has to be restarted
      ansible.builtin.set_fact:
        kubernetes_port_moved: "{{ kubernetes_port_check.rc == 1 or kubernetes_kubeconfigs is changed }}"

    # Stopped containers of static pods are started again by kubelet with the new kubeconfig.
    - name: Restart kubelet, controller manager and scheduler
      ansible.builtin.shell: |
        set -e
        systemctl restart kubelet
        for name in kube-controller-manager kube-scheduler; do
          crictl ps --name "^${name}$" -q | xargs -r crictl stop
        done
      args:
        executable: /bin/bash
      when: kubernetes_port_moved
      changed_when: true

    - name: Wait for the API server on the configured port
      ansible.builtin.wait_for:
        host: "{{ node_ip }}"
        port: "{{ kube_api_port | int }}"
        timeout: 300
      when: kubernetes_port_moved
      no_log: true

    - name: Store the kubeadm configuration in the cluster
      ansible.builtin.command: >-
        kubeadm init phase upload-config kubeadm --config /etc/kubernetes/kubeadm-config.yaml
      when: kubernetes_port_moved
      register: kubernetes_upload_config
      changed_when: true
      retries: 30
      delay: 10
      until: kubernetes_upload_config.rc == 0
