- name: Install host firewall rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Load firewall rules

# Never restart nftables.service: its stop action flushes ALL rules, including the CNI's.
- name: Load firewall rules at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true

- name: Apply firewall rules now
  ansible.builtin.meta: flush_handlers
