# Runs after the firewall role, which has already opened ssh_port.
# Root login is switched off here and not by scripts/bootstrap-server.sh: reaching this task
# proves that the login as "infra" with sudo works.
- name: Configure sshd (keys only, non-standard port, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-infra-hardening.conf
    mode: "0600"
    content: |
      Port {{ ssh_port }}
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    validate: /usr/sbin/sshd -t -f %s
  register: ssh_config
  no_log: true

# Ubuntu starts sshd through ssh.socket, whose port is generated from sshd_config. systemd
# refuses to start a socket while its service is running, so the service is stopped first; the
# next connection starts it again. Sessions that are already open survive this.
- name: Apply the sshd configuration
  ansible.builtin.shell: |
    set -e
    systemctl daemon-reload
    if systemctl is-enabled --quiet ssh.socket 2>/dev/null; then
      systemctl stop ssh.service
      systemctl restart ssh.socket
    else
      systemctl restart ssh.service
    fi
  args:
    executable: /bin/bash
  when: ssh_config.changed  # noqa: no-handler - must happen before the connection is switched below
  changed_when: true

- name: Verify that sshd answers on the configured port
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ ssh_port | int }}"
    timeout: 60
  delegate_to: localhost
  no_log: true

- name: Use the configured port from now on
  ansible.builtin.set_fact:
    ansible_port: "{{ ssh_port | int }}"
  no_log: true

- name: Reconnect
  ansible.builtin.meta: reset_connection

- name: Wait for the connection on the configured port
  ansible.builtin.wait_for_connection:
    timeout: 60
