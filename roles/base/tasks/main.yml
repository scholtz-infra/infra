- name: Set hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Make the hostname and the internal API name resolvable
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE infra"
    block: |
      {{ node_ip }} {{ inventory_hostname }}
      127.0.0.1 {{ kube_api_internal_host }}

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - jq
      - chrony
      - python3-debian
      - unattended-upgrades
      - nftables
      # required by Longhorn
      - open-iscsi
      - nfs-common
      - cryptsetup
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove multipath-tools (not needed on dedicated servers, grabs Longhorn volumes)
  ansible.builtin.apt:
    name: multipath-tools
    state: absent

- name: Enable iscsid for Longhorn
  ansible.builtin.systemd_service:
    name: iscsid
    enabled: true
    state: started

- name: Configure automatic security updates (no automatic reboot, reboots are done by os-patch)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52infra-unattended
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] > 0
  changed_when: true

- name: Disable swap permanently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter
  notify: Load kernel modules

- name: Configure sysctl
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-k8s.conf
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      fs.inotify.max_user_instances = 8192
      fs.inotify.max_user_watches = 524288
      net.ipv4.ip_local_reserved_ports = {{ reserved_ports | map('int') | unique | sort | join(',') }}
  notify: Apply sysctl

- name: Apply kernel settings before continuing
  ansible.builtin.meta: flush_handlers
