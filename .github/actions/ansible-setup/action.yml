name: Ansible setup
description: Installs Ansible and the SSH credentials needed to reach the servers.
inputs:
  ssh-private-key:
    description: Private key that is authorised for root on every server
    required: true
  ssh-known-hosts:
    description: known_hosts lines for every server (ssh-keyscan output)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: pip
    - name: Install Ansible
      shell: bash
      run: pip install --quiet -r requirements.txt
    - name: Install SSH credentials
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      run: |
        if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
          echo "::error::Secrets SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS must be set on this environment (see docs/setup.md)"
          exit 1
        fi
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
