name: Ansible setup
description: Installs Ansible and the SSH credentials needed to reach the servers.
inputs:
  ssh-private-key:
    description: Private key that is authorised for the user infra on every server
    required: true
  ssh-known-hosts:
    description: known_hosts lines for every server, keyed by inventory name (see docs/setup.md)
    required: true
  node-ips:
    description: Server addresses, one "<inventory name> <public IPv4>" per line (see docs/secrets.md)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: pip
    - name: Install Ansible
      shell: bash
      run: pip install --quiet -r requirements.txt
    - name: Install SSH credentials
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        NODE_IPS: ${{ inputs.node-ips }}
      run: |
        if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ] || [ -z "$NODE_IPS" ]; then
          echo "::error::Secrets SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS and NODE_IPS must be set as repository secrets (see docs/secrets.md)"
          exit 1
        fi
        NODE_IPS=${NODE_IPS//$'\r'/}
        # GitHub only hides the secret as a whole: hide every single address in the log as well,
        # before anything about the secret is printed.
        for token in $NODE_IPS; do
          [[ "$token" == *[.:]* ]] && echo "::add-mask::$token"
        done
        names=()
        bad=0
        while read -r name address rest; do
          [ -z "$name" ] && continue
          if [[ -z "$rest" && "$name" =~ ^[a-z][a-z0-9-]*$ && "$address" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            names+=("$name")
          else
            bad=$((bad + 1))
          fi
        done <<< "$NODE_IPS"
        if [ "$bad" -gt 0 ]; then
          echo "::error::NODE_IPS has $bad line(s) in the wrong format. Every line must be '<inventory name> <IPv4>' (see docs/secrets.md)"
          exit 1
        fi
        echo "NODE_IPS holds an address for: ${names[*]}"
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
