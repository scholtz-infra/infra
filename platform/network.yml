# Network access between namespaces. The cluster is deny-first:
#
#   - every pod accepts traffic only from pods in its own namespace and from the nodes
#     (kubelet health checks, API server webhooks);
#   - cluster DNS is reachable from everywhere;
#   - anything else between namespaces, and anything from the internet, is dropped unless it is
#     listed here.
#
# Outgoing traffic is not restricted: a connection is blocked by the receiving namespace.
#
# Each entry lets all pods of namespace `from` connect to all pods of namespace `to`, optionally
# only on the given TCP ports. One entry per (to, from) pair. Apply with the `platform` playbook;
# removing an entry removes the access.
network_allow:
  # Prometheus collects the metrics of the cluster DNS.
  - to: kube-system
    from: monitoring
    ports: [9153]
  # The secrets operator reads from Vault (docs/vault.md).
  - to: vault
    from: vault-secrets-operator
    ports: [8200]
# - to: redis
#   from: my-app
#   ports: [6379]

# Namespaces whose pods may receive web traffic from the internet through the ingress
# (port 443 of the load balancer). An Ingress in a namespace that is not listed here answers 403.
network_web:
  - headlamp # dashboard, docs/dashboard.md
  - monitoring # Grafana, docs/monitoring.md
  - vault # Vault web UI and API, docs/vault.md
# - my-app
