# Helm releases that make up the platform, installed in this order by playbooks/platform.yml.
# To add an infrastructure application (Redis, ...): add an entry here plus a values file in
# platform/values/<name>.yaml (a Jinja template, inventory variables are available).
platform_releases:
  - name: cilium
    namespace: kube-system
    repo: https://helm.cilium.io
    chart: cilium
    # renovate: datasource=helm registryUrl=https://helm.cilium.io depName=cilium
    version: "1.20.5"

  - name: longhorn
    namespace: longhorn-system
    repo: https://charts.longhorn.io
    chart: longhorn
    # renovate: datasource=helm registryUrl=https://charts.longhorn.io depName=longhorn
    version: "1.13.0"

  - name: cert-manager
    namespace: cert-manager
    repo: https://charts.jetstack.io
    chart: cert-manager
    # renovate: datasource=helm registryUrl=https://charts.jetstack.io depName=cert-manager
    version: "v1.21.3"

  # Web dashboard (docs/dashboard.md).
  - name: headlamp
    namespace: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    # renovate: datasource=helm registryUrl=https://kubernetes-sigs.github.io/headlamp/ depName=headlamp
    version: "0.46.0"

  # Prometheus, Alertmanager and Grafana (docs/monitoring.md).
  - name: monitoring
    namespace: monitoring
    repo: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # renovate: datasource=helm registryUrl=https://prometheus-community.github.io/helm-charts depName=kube-prometheus-stack
    version: "93.7.0"

  # Secret store (docs/vault.md). Initialised, unsealed and configured by
  # playbooks/tasks/vault-configure.yml.
  - name: vault
    namespace: vault
    repo: https://helm.releases.hashicorp.com
    chart: vault
    # renovate: datasource=helm registryUrl=https://helm.releases.hashicorp.com depName=vault
    version: "0.34.1"

  # Copies secrets from Vault into Kubernetes Secrets and keeps them up to date (docs/vault.md).
  - name: vault-secrets-operator
    namespace: vault-secrets-operator
    repo: https://helm.releases.hashicorp.com
    chart: vault-secrets-operator
    # renovate: datasource=helm registryUrl=https://helm.releases.hashicorp.com depName=vault-secrets-operator
    version: "2.0.0"

# renovate: datasource=github-releases depName=helm/helm extractVersion=^v(?<version>.+)$
helm_version: "4.3.2"

# Node-local volumes for workloads that need raw disk speed (StorageClass "local-path").
# renovate: datasource=github-releases depName=rancher/local-path-provisioner extractVersion=^v(?<version>.+)$
local_path_provisioner_version: "0.0.37"
