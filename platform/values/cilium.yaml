kubeProxyReplacement: true
# local HAProxy on every node (roles/apilb)
k8sServiceHost: 127.0.0.1
k8sServicePort: {{ kube_api_lb_port }}

routingMode: tunnel
tunnelProtocol: vxlan

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - {{ pod_cidr }}
    clusterPoolIPv4MaskSize: 24

# Nodes only have public IPs: encrypt all pod traffic between nodes.
encryption:
  enabled: true
  type: wireguard

operator:
  rollOutPods: true
  replicas: {{ 2 if k8s_multi_node else 1 }}

# Restart Cilium components when their configuration changes, so settings below take effect.
rollOutCiliumPods: true
envoy:
  rollOutPods: true
  securityContext:
    capabilities:
      # Envoy binds ports 80/443 on the host: chart defaults plus NET_BIND_SERVICE.
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE

# Ingress controller built into Cilium (IngressClass "cilium", the cluster default).
# There is no cloud load balancer: Envoy listens on ports 80 and 443 of every node, and DNS
# records point at the node IPs. One shared listener serves all Ingress resources.
ingressController:
  enabled: true
  default: true
  loadbalancerMode: shared
  enforceHttps: true
  hostNetwork:
    enabled: true
    httpPort: 80
    httpsPort: 443
