# Vault Secrets Operator: turns VaultStaticSecret objects into Kubernetes Secrets and keeps them
# equal to what is stored in Vault (docs/vault.md).

# The connection to Vault (VaultConnection "default") is not created by the chart: Helm would wait
# for it to become healthy, which it cannot be before Vault is initialised and the network rule
# exists. playbooks/tasks/vault-configure.yml creates it once Vault is ready.
defaultVaultConnection:
  enabled: false

# No cluster-wide default login: every application namespace gets its own VaultAuth and service
# account from the `apps` playbook, and Vault only lets it read kv/<its own namespace>/.
defaultAuthMethod:
  enabled: false

controller:
  manager:
    # A synced Secret holds exactly the keys of the Vault secret. Without this the operator adds
    # a key "_raw" with the whole secret as JSON, which shows up as an extra file when the
    # Secret is mounted as a directory.
    globalTransformationOptions:
      excludeRaw: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
